# Recommended for a permanent server: Apache (XAMPP) serves the built pages and the PHP endpoints.
# 1. Copy the r1mc-wfp folder to C:\r1mc-wfp (or change the paths below).
# 2. In C:\xampp\apache\conf\httpd.conf add the line:   Include "C:/r1mc-wfp/deploy/apache-wfp.conf"
# 3. Restart Apache in the XAMPP Control Panel, then open http://<server>:86/
Listen 86

<VirtualHost *:86>
    ServerName r1mc-wfp
    DocumentRoot "C:/r1mc-wfp/frontend/dist"

    # Database settings (same names as start.local.bat)
    SetEnv WFP_DB_HOST 127.0.0.1
    SetEnv WFP_DB_PORT 3306
    SetEnv WFP_DB_NAME r1mc_wfp
    SetEnv WFP_DB_USER root
    SetEnv WFP_DB_PASS ""

    Alias /api/ "C:/r1mc-wfp/backend/api/"
    <Directory "C:/r1mc-wfp/backend/api">
        Require all granted
        Options -Indexes
        <Files "cors.php">
            Require all denied
        </Files>
    </Directory>

    <Directory "C:/r1mc-wfp/frontend/dist">
        Require all granted
        Options -Indexes
        # Vue Router history mode: unknown paths get index.html
        FallbackResource /index.html
    </Directory>

    <IfModule mod_headers.c>
        <Files "index.html">
            Header set Cache-Control "no-cache"
        </Files>
    </IfModule>
</VirtualHost>
